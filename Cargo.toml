[package]
name = "yiterm"
version = "0.0.14"
edition = "2024"
default-run = "yiterm"

[features]
default = ["x11", "wayland"]
x11 = ["eframe/x11"]
wayland = ["eframe/wayland"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
include_dir = "0.7"
alacritty_terminal = "0.26"
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
portable-pty = "0.9"
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
time = "0.3"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }
zeroize = "1"
hmac = "0.13"
sha1 = "0.11"
self-replace = "1.5"
self_update = { version = "1.3.1", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
semver = "1.0.28"
sha2 = "0.10"
serde_json = "1.0.154"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest", "runtime_shaders"] }
gpui-component = "=0.5.0"
gpui-component-assets = "=0.5.0"
async-channel = "2"
futures-lite = "2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui-winit = { version = "0.33.3", default-features = false, features = ["terminal-input"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std"] }
raw-window-handle = { version = "0.6", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO"] }
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
eframe = { path = "vendor/eframe" }
egui-winit = { path = "vendor/egui-winit" }
glutin = { path = "vendor/glutin" }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
