name: Linux software rendering comparison
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Actions run containing the baseline Linux artifact
        required: true
        default: '38884649778'
      candidate_run:
        description: Actions run containing the candidate Linux artifact
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: yiterm-*-linux-x64
          merge-multiple: true
          path: baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: yiterm-*-linux-x64
          merge-multiple: true
          path: candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Check and unpack both artifacts
        run: |
          for directory in baseline candidate; do
            (cd "$directory" && sha256sum -c *.sha256 && tar -xzf *.tar.gz)
          done
      - name: Compare on CentOS 7 Mesa software rendering
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux2014_x86_64 bash -euc '
              yum install -y libX11 libXcursor libXi libXrandr libxcb libxkbcommon libxkbcommon-x11 mesa-libGL mesa-dri-drivers xorg-x11-server-Xvfb xdotool xorg-x11-utils
              export PATH="/opt/python/cp313-cp313/bin:$PATH"
              Xvfb :99 -screen 0 1920x1080x24 +extension GLX &
              export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
              for attempt in {1..30}; do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
              xdpyinfo >/dev/null
              python3 scripts/perf_linux.py "$(find baseline -type f -name yiterm -print -quit)" "$(find candidate -type f -name yiterm -print -quit)"
            '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-performance-results
          path: performance-results/*
          if-no-files-found: warn
