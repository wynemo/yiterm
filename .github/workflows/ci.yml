name: Build YiTerm

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "1"

jobs:
  build:
    name: ${{ matrix.platform }} build
    runs-on: ${{ matrix.runner }}
    env:
      YITERM_BUILD_REV: ${{ github.sha }}
      CARGO_INCREMENTAL: "0"
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The exact cache key includes every vendor file. Keep checkout mtimes
      # stable so Cargo can reuse unchanged path dependencies after restore.
      - name: Normalize vendored dependency timestamps
        shell: python
        run: |
          import os
          from pathlib import Path

          timestamp = 946684800  # 2000-01-01 UTC
          vendor = Path("vendor")
          for path in vendor.rglob("*"):
              os.utime(path, (timestamp, timestamp))
          os.utime(vendor, (timestamp, timestamp))

      # rust-cache removes crates inside the workspace root, including vendor/.
      # Preserve them and use exact matches only: normalizing mtimes is safe
      # only when the vendored source matches the cached compilation artifacts.
      - name: Cache Cargo dependencies and release artifacts
        id: release-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: release-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'vendor/**', '.cargo/**', '.github/workflows/ci.yml') }}

      - name: Build release
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
          # A successful build populated all dependencies for this exact key.
          CARGO_NET_OFFLINE: ${{ steps.release-cache.outputs.cache-hit == 'true' }}
        run: cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: Package binary and verify architecture
        id: package
        run: python scripts/package.py --target ${{ matrix.target }}

      - name: Verify embedded Windows application icon
        if: runner.os == 'Windows'
        run: python scripts/verify_windows_icon.py target/${{ matrix.target }}/release/yiterm.exe

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: yiterm-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Windows profiling symbols and matching executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: profiling-windows-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/yiterm.exe
            target/${{ matrix.target }}/release/yiterm.pdb
          if-no-files-found: error
          retention-days: 30

  linux:
    name: linux-x64 build (CentOS 7 / glibc 2.17)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/cache/restore@v4
        id: linux-cache
        with:
          path: |
            ~/.cache/yiterm-linux
            target/x86_64-unknown-linux-gnu
            target/release
          key: linux-centos7-rust-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'scripts/build_linux.sh') }}
          restore-keys: linux-centos7-rust-1.99.1-

      # Run Docker explicitly: GitHub's Node actions cannot run on glibc 2.17.
      - name: Build and package in CentOS 7 userspace
        id: package
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/.cache/yiterm-linux"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/yiterm-linux:/ci-cache" \
            -v "$GITHUB_OUTPUT:/github-output" \
            -e GITHUB_OUTPUT=/github-output \
            -e YITERM_BUILD_REV \
            -e CARGO_HOME=/ci-cache/cargo \
            -e RUSTUP_HOME=/ci-cache/rustup \
            -e RUST_TOOLCHAIN=1.99.1 \
            -e CARGO_PROFILE_RELEASE_DEBUG \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /work/scripts/build_linux.sh build

      - name: Restore runner ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cache/yiterm-linux"

      - uses: actions/cache/save@v4
        if: always() && steps.linux-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/yiterm-linux
            target/x86_64-unknown-linux-gnu
            target/release
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

      - name: Restore package ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: yiterm-${{ steps.package.outputs.version }}-linux-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Linux profiling symbols and matching executable
        uses: actions/upload-artifact@v7
        with:
          name: profiling-linux-${{ github.sha }}
          path: |
            target/x86_64-unknown-linux-gnu/release/profiling/yiterm
            target/x86_64-unknown-linux-gnu/release/profiling/yiterm.debug
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build, linux]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.tag != '' && needs.linux.outputs.tag == needs.build.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages from this build
        uses: actions/download-artifact@v8
        with:
          pattern: yiterm-*
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          if (( ${#assets[@]} == 0 )); then
            echo "No release packages found" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
