name: Build YiTerm

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "1"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      # rust-cache hashes every installed toolchain, including runner preinstalls.
      - name: Keep only the pinned Rust toolchain
        shell: bash
        run: |
          active="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          while read -r toolchain _; do
            if [[ "$toolchain" != "$active" ]]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list)

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload Windows profiling symbols and matching executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: profiling-windows-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/yiterm.exe
            target/${{ matrix.target }}/release/yiterm.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Test logging and child process forwarding
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: cargo test --locked --release --target ${{ matrix.target }} --test logging

      - name: Test release updater and restart helper
        run: |
          cargo test --locked --release --target ${{ matrix.target }} --lib update::tests
          cargo test --locked --release --target ${{ matrix.target }} --test update

      - name: Test profiling aggregates and idle repaint regression
        run: |
          cargo test --locked --release --target ${{ matrix.target }} --bin yiterm profiling::tests
          cargo test --locked --release --target ${{ matrix.target }} --bin yiterm repaint_tests

      - name: Test terminal Unicode rendering and emoji column widths
        run: cargo test --locked --release --target ${{ matrix.target }} --bin yiterm terminal_unicode_

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Package binary and verify architecture
        id: package
        run: python scripts/package.py --target ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: yiterm-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux:
    name: linux-x64 build (CentOS 7 / glibc 2.17)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/cache/restore@v4
        id: linux-cache
        with:
          path: |
            ~/.cache/yiterm-linux
            target/x86_64-unknown-linux-gnu
            target/release
          key: linux-centos7-rust-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'scripts/build_linux.sh') }}
          restore-keys: linux-centos7-rust-1.99.1-

      # Run Docker explicitly: GitHub's Node actions cannot run on glibc 2.17.
      - name: Build and package in CentOS 7 userspace
        id: package
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/.cache/yiterm-linux"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/yiterm-linux:/ci-cache" \
            -v "$GITHUB_OUTPUT:/github-output" \
            -e GITHUB_OUTPUT=/github-output \
            -e YITERM_BUILD_REV \
            -e CARGO_HOME=/ci-cache/cargo \
            -e RUSTUP_HOME=/ci-cache/rustup \
            -e RUST_TOOLCHAIN=1.99.1 \
            -e CARGO_PROFILE_RELEASE_DEBUG \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /work/scripts/build_linux.sh build

      - name: Restore runner ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cache/yiterm-linux"

      - uses: actions/cache/save@v4
        if: always() && steps.linux-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/yiterm-linux
            target/x86_64-unknown-linux-gnu
            target/release
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

      - name: Restore package ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: yiterm-${{ steps.package.outputs.version }}-linux-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Linux profiling symbols and matching executable
        uses: actions/upload-artifact@v7
        with:
          name: profiling-linux-${{ github.sha }}
          path: |
            target/x86_64-unknown-linux-gnu/release/profiling/yiterm
            target/x86_64-unknown-linux-gnu/release/profiling/yiterm.debug
          if-no-files-found: error
          retention-days: 30

  linux-test:
    name: linux-x64 tests (CentOS 7 / Xvfb)
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/yiterm-linux
            target/x86_64-unknown-linux-gnu
            target/release
          key: linux-centos7-rust-1.99.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'scripts/build_linux.sh') }}
          restore-keys: linux-centos7-rust-1.99.1-

      - uses: actions/download-artifact@v8
        with:
          name: yiterm-${{ needs.linux.outputs.version }}-linux-x64
          path: dist

      - name: Verify and extract the uploaded Linux package
        run: |
          cd dist
          sha256sum -c *.sha256
          tar -xzf *.tar.gz

      - name: Test in CentOS 7 userspace
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/.cache/yiterm-linux"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/yiterm-linux:/ci-cache" \
            -e YITERM_BUILD_REV \
            -e CARGO_HOME=/ci-cache/cargo \
            -e RUSTUP_HOME=/ci-cache/rustup \
            -e RUST_TOOLCHAIN=1.99.1 \
            -e CARGO_PROFILE_RELEASE_DEBUG \
            quay.io/pypa/manylinux2014_x86_64 \
            bash /work/scripts/build_linux.sh test

  release:
    name: Publish GitHub Release
    needs: [build, linux, linux-test]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.tag != '' && needs.linux.outputs.tag == needs.build.outputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages from this build
        uses: actions/download-artifact@v8
        with:
          pattern: yiterm-*
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          if (( ${#assets[@]} == 0 )); then
            echo "No release packages found" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
