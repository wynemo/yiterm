name: Build YiTerm

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: "1"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      # rust-cache hashes every installed toolchain, including runner preinstalls.
      - name: Keep only the pinned Rust toolchain
        shell: bash
        run: |
          active="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          while read -r toolchain _; do
            if [[ "$toolchain" != "$active" ]]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done < <(rustup toolchain list)

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload Windows profiling symbols and matching executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: profiling-windows-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/yiterm.exe
            target/${{ matrix.target }}/release/yiterm.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Test logging and child process forwarding
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: cargo test --locked --release --target ${{ matrix.target }} --test logging

      - name: Test profiling aggregates and idle repaint regression
        run: |
          cargo test --locked --release --target ${{ matrix.target }} --bin yiterm profiling::tests
          cargo test --locked --release --target ${{ matrix.target }} --bin yiterm repaint_tests

      - name: Test terminal Unicode rendering and emoji column widths
        run: cargo test --locked --release --target ${{ matrix.target }} --bin yiterm terminal_unicode_

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Package binary and verify architecture
        id: package
        run: python scripts/package.py --target ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: yiterm-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages from this build
        uses: actions/download-artifact@v8
        with:
          pattern: yiterm-*
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          if (( ${#assets[@]} == 0 )); then
            echo "No release packages found" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
