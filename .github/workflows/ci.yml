name: Build YiTerm

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-14
            platform: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Upload Windows profiling symbols and matching executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: profiling-windows-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/yiterm.exe
            target/${{ matrix.target }}/release/yiterm.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Test logging and child process forwarding
        env:
          YITERM_BUILD_REV: ${{ github.sha }}
        run: cargo test --locked --release --target ${{ matrix.target }} --test logging

      - name: Test profiling aggregates
        run: cargo test --locked --release --target ${{ matrix.target }} --bin yiterm profiling::tests

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Package binary and verify architecture
        id: package
        run: python scripts/package.py --target ${{ matrix.target }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: yiterm-${{ steps.package.outputs.version }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    steps:
      - name: Find the main build for this commit
        id: main-build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 180); do
            runs="$(gh api --method GET "repos/${GH_REPO}/actions/workflows/ci.yml/runs" \
              -f head_sha="$COMMIT_SHA" -f branch=main -f event=push -F per_page=100)"
            run_id="$(jq -r --arg sha "$COMMIT_SHA" '
              .workflow_runs
              | map(select(.head_sha == $sha and .head_branch == "main" and .event == "push"))
              | sort_by(.created_at)
              | last
              | .id // empty
            ' <<< "$runs")"
            if [[ -n "$run_id" ]]; then
              run="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<< "$run")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" != success ]]; then
                  echo "Main build $run_id for $COMMIT_SHA finished with '$conclusion'" >&2
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "No successful main build found for tagged commit $COMMIT_SHA" >&2
          exit 1

      - name: Download packages from the main build
        uses: actions/download-artifact@v8
        with:
          pattern: yiterm-*
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.main-build.outputs.run_id }}
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz dist/*.sha256)
          if (( ${#assets[@]} == 0 )); then
            echo "No release packages found" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
