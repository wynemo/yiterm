[logging]
# Levels: off, error, warn, info, debug, trace. Module overrides are supported.
filter = "warn,yiterm=info"
file = true
# Optional absolute path; omit to use the platform's default log directory.
# directory = "/path/to/logs"
rotation = "daily"
max_files = 14

[cursor]
# block / underline / beam
shape = "block"
blinking = true

[appearance]
# dark / light
theme = "dark"
# Show the bottom bar with Paste and session status.
show_status_bar = true

# Terminal font (size in pixels, 8–48).
[font]
family = "Lilex"
size = 16.0
# Ordered fallback font families for missing characters.
fallbacks = []
# Optional font for Chinese, Japanese and Korean characters.
# cjk_family = "PingFang SC"

# Windows: open Ctrl-clicked terminal links in the built-in SSH browser.
[browser]
open_links_in_browser = true

# Shell for new local terminals. default / program
[shell]
mode = "default"
# Executable name or path only; used when mode = "program".
# Windows examples: powershell.exe, pwsh.exe, cmd.exe
# macOS/Linux examples: /bin/zsh, /bin/bash
# program = "powershell.exe"
# Optional startup arguments in Program mode. See TECHNICAL.md.
# arguments = "-NoLogo -NoProfile"
# Literal NAME=value assignments, one per line; applied to new local shells.
# Empty lines are ignored. No quotes or variable expansion inside values.
environment = """
"""
