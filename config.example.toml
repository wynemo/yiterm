[logging]
# Levels: off, error, warn, info, debug, trace. Module overrides are supported.
filter = "warn,yiterm=info"
file = true
# Optional absolute path; omit to use the platform's default log directory.
# directory = "/path/to/logs"
rotation = "daily"
max_files = 14

[cursor]
# block / underline / beam
shape = "block"
blinking = true

[appearance]
# dark / light
theme = "dark"

# Terminal font (size in pixels, 8–48).
[font]
family = "Lilex"
size = 16.0

# Windows: open Ctrl-clicked terminal links in the built-in SSH browser.
[browser]
open_links_in_browser = true
