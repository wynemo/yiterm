<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SSH VNC</title>
<style>
body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #202124; color: #eee; font: 14px system-ui; }
#controls { flex: 0 1 auto; min-height: 0; overflow: auto; padding-right: 130px; }
#controls[hidden] { display: none; }
#toggle-controls { position: fixed; top: 6px; right: 6px; z-index: 1; }
form, .tools { display: flex; gap: 8px; padding: 10px; flex-wrap: wrap; }
input, button, select { padding: 5px; }
#monitors { display: inline-flex; gap: 4px; align-items: center; }
#monitors button[aria-pressed="true"] { background: #1769aa; color: white; border-color: #67b7ff; }
#screen { position: relative; flex: 1 0 0; min-height: 0; overflow: hidden; }
#status { padding: 0 10px; }
dialog form { flex-direction: column; }
</style>
<button id="toggle-controls" type="button" aria-controls="controls" aria-expanded="true">Hide controls</button>
<div id="controls">
<form id="form">
  <label>Host <input id="host" value="localhost" required maxlength="255"></label>
  <label>Port <input id="port" type="number" value="5901" min="1" max="65535" required></label>
  <button>Connect / Reconnect</button>
</form>
<div class="tools">
  <button id="disconnect">Disconnect</button>
  <label><input id="scale" type="checkbox" checked>Fit</label>
  <label><input id="readonly" type="checkbox">View only</label>
  <span id="monitors" role="group" aria-label="Screen">Screen</span>
  <span id="screen-info" role="status"></span>
  <button id="cad">Ctrl+Alt+Del</button>
  <button id="paste">Send clipboard text</button>
</div>
<p id="status" role="status">Loading VNC client…</p>
</div>
<div id="screen"></div>
<dialog id="credentials"><form id="login"><strong>VNC authentication</strong><div id="fields"></div><button>Connect</button><button id="cancel" type="button">Cancel</button></form></dialog>
<script type="module">
import RFB from './core/rfb.js';
let rfb;
const el = id => document.getElementById(id);
const status = text => el('status').textContent = text;
let lastDiagnostic = '';
const reportProtocol = event => {
    const layout = rfb.desktopLayout;
    const body = JSON.stringify({ event, ...rfb.protocolInfo, width: layout.width,
        height: layout.height, screens: layout.screens.length,
        selected_screen: layout.selectedScreenId });
    if (body === lastDiagnostic) return;
    lastDiagnostic = body;
    fetch(new URL('./diagnostic', location.href), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
    }).catch(() => {});
};
let screenInfoTimer;
let selectedMonitor = -1;
let monitorsConnected = false;
const renderMonitors = () => {
    el('monitors').replaceChildren('Screen ');
    const screens = monitorsConnected ? rfb.desktopLayout.screens : [];
    const add = (label, index, title) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.title = title;
        button.disabled = !monitorsConnected;
        button.setAttribute('aria-pressed', String(selectedMonitor === index));
        button.onclick = () => {
            rfb.selectScreen(index < 0 ? null : screens[index].id);
            selectedMonitor = index;
            renderMonitors();
            rfb.focus({ preventScroll: true });
        };
        el('monitors').append(button);
    };
    add('All', -1, 'Show all screens');
    screens.forEach((screen, index) => {
        add(`Screen ${index + 1}`, index, `${screen.width} x ${screen.height}`);
    });
};
const resetMonitors = (connected = false) => {
    clearTimeout(screenInfoTimer);
    selectedMonitor = connected && rfb.desktopLayout.nativeSelection
        ? rfb.desktopLayout.screens.findIndex(screen => screen.id === rfb.desktopLayout.selectedScreenId)
        : -1;
    monitorsConnected = connected;
    renderMonitors();
    const waiting = connected && rfb.desktopLayout.screens.length === 0;
    el('screen-info').textContent = waiting ? 'Detecting screens...' : '';
    if (waiting) {
        screenInfoTimer = setTimeout(() => {
            el('screen-info').textContent = 'Server did not provide a screen list.';
        }, 8000);
    }
};
renderMonitors();
el('toggle-controls').onclick = () => {
    const hidden = !el('controls').hidden;
    el('controls').hidden = hidden;
    el('toggle-controls').textContent = hidden ? 'Show controls' : 'Hide controls';
    el('toggle-controls').setAttribute('aria-expanded', String(!hidden));
    if (hidden) rfb?.focus({ preventScroll: true });
};
const clearCredentials = () => { el('credentials').close(); el('fields').replaceChildren(); };
status('Connect to a VNC server through the current SSH session.');
el('form').onsubmit = event => {
    event.preventDefault();
    resetMonitors();
    clearCredentials();
    rfb?.disconnect();
    el('screen').replaceChildren();
    const url = new URL('./ws', location.href);
    url.protocol = 'ws:';
    url.search = new URLSearchParams({host: el('host').value, port: el('port').value});
    status('Connecting…');
    let client;
    try { client = new RFB(el('screen'), url.href); }
    catch { status('Cannot initialize VNC client'); return; }
    rfb = client;
    // Some servers omit cursor images or send a transparent cursor.
    client.showDotCursor = true;
    client.scaleViewport = el('scale').checked;
    client.viewOnly = el('readonly').checked;
    client.addEventListener('desktoplayout', () => {
        if (rfb === client) { resetMonitors(true); reportProtocol('layout'); }
    });
    client.addEventListener('protocolinfo', () => {
        if (rfb === client) reportProtocol('layout');
    });
    client.addEventListener('connect', () => {
        if (rfb === client) { status('Connected'); resetMonitors(true); reportProtocol('connection'); }
    });
    client.addEventListener('disconnect', event => {
        if (rfb !== client) return;
        resetMonitors();
        clearCredentials();
        status(event.detail.clean ? 'Disconnected' : 'Connection failed or SSH disconnected. Check target, authentication and SSH forwarding.');
    });
    client.addEventListener('securityfailure', () => {
        if (rfb === client) status('VNC authentication failed');
    });
    client.addEventListener('credentialsrequired', event => {
        if (rfb !== client) return;
        clearCredentials();
        const fields = event.detail.types.map(type => {
            const label = document.createElement('label');
            label.textContent = type + ' ';
            const input = document.createElement('input');
            input.type = type === 'password' ? 'password' : 'text';
            input.autocomplete = 'off';
            label.append(input);
            el('fields').append(label);
            return [type, input];
        });
        el('login').onsubmit = event => {
            event.preventDefault();
            client.sendCredentials(Object.fromEntries(fields.map(([type, input]) => [type, input.value])));
            clearCredentials();
        };
        el('credentials').showModal();
        fields[0]?.[1].focus();
    });
    client.addEventListener('clipboard', event => {
        if (rfb === client) prompt('Remote clipboard (copy text):', event.detail.text);
    });
};
el('cancel').onclick = () => { clearCredentials(); rfb?.disconnect(); };
el('credentials').oncancel = () => { clearCredentials(); rfb?.disconnect(); };
el('disconnect').onclick = () => rfb?.disconnect();
el('scale').onchange = () => { if (rfb) rfb.scaleViewport = el('scale').checked; };
el('readonly').onchange = () => { if (rfb) rfb.viewOnly = el('readonly').checked; };
el('cad').onclick = () => rfb?.sendCtrlAltDel();
el('paste').onclick = () => {
    const text = prompt('Text to send to remote clipboard');
    if (text !== null) rfb?.clipboardPasteFrom(text);
};
</script>
</html>
