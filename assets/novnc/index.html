<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SSH VNC</title>
<style>
body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #202124; color: #eee; font: 14px system-ui; }
#controls { flex: 0 1 auto; min-height: 0; overflow: auto; padding-right: 130px; }
#controls[hidden] { display: none; }
#toggle-controls { position: fixed; top: 6px; right: 6px; z-index: 1; }
form, .tools { display: flex; gap: 8px; padding: 10px; flex-wrap: wrap; }
input, button, select { padding: 5px; }
#screen { position: relative; flex: 1 0 0; min-height: 0; overflow: hidden; }
#region-picker { position: absolute; inset: 0; z-index: 2; cursor: crosshair; touch-action: none; }
#region-picker[hidden], #selection[hidden] { display: none; }
#region-hint { position: absolute; top: 8px; left: 8px; padding: 6px; background: #202124; }
#selection { position: fixed; border: 2px solid #67b7ff; box-sizing: border-box; background: #67b7ff33; pointer-events: none; }
#status { padding: 0 10px; }
dialog form { flex-direction: column; }
</style>
<button id="toggle-controls" type="button" aria-controls="controls" aria-expanded="true">Hide controls</button>
<div id="controls">
<form id="form">
  <label>Host <input id="host" value="localhost" required maxlength="255"></label>
  <label>Port <input id="port" type="number" value="5901" min="1" max="65535" required></label>
  <button>Connect / Reconnect</button>
</form>
<div class="tools">
  <button id="disconnect">Disconnect</button>
  <label><input id="scale" type="checkbox" checked>Fit</label>
  <label><input id="readonly" type="checkbox">View only</label>
  <label>Screen <select id="monitor" disabled><option value="all">All screens</option></select></label>
  <button id="select-region" type="button" disabled>Select area…</button>
  <button id="cad">Ctrl+Alt+Del</button>
  <button id="paste">Send clipboard text</button>
</div>
<p id="status" role="status">Loading VNC client…</p>
</div>
<div id="screen"></div>
<dialog id="credentials"><form id="login"><strong>VNC authentication</strong><div id="fields"></div><button>Connect</button><button id="cancel" type="button">Cancel</button></form></dialog>
<script type="module">
import RFB from './core/rfb.js';
let rfb;
const el = id => document.getElementById(id);
const status = text => el('status').textContent = text;
let customRegion = null;
let cancelSelection = () => {};
const resetMonitors = (connected = false) => {
    cancelSelection();
    customRegion = null;
    el('monitor').replaceChildren(new Option('All screens', 'all'));
    (connected ? rfb.desktopLayout.screens : []).forEach((screen, index) => {
        el('monitor').add(new Option(`Screen ${index + 1} (${screen.width} × ${screen.height})`, String(index)));
    });
    el('monitor').disabled = !connected;
    el('select-region').disabled = !connected;
};
el('monitor').onchange = () => {
    const value = el('monitor').value;
    rfb.displayRegion = value === 'all' ? null :
        value === 'custom' ? customRegion : rfb.desktopLayout.screens[Number(value)];
    rfb.focus({ preventScroll: true });
};
el('select-region').onclick = () => {
    cancelSelection();
    const client = rfb;
    client.displayRegion = null;
    client.scaleViewport = true;
    el('scale').checked = true;
    el('monitor').value = 'all';
    const picker = document.createElement('div');
    picker.id = 'region-picker';
    const hint = document.createElement('div');
    hint.id = 'region-hint';
    hint.append('Drag around one screen. Esc to cancel. ');
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.textContent = 'Cancel';
    hint.append(cancel);
    const box = document.createElement('div');
    box.id = 'selection';
    box.hidden = true;
    picker.append(hint, box);
    el('screen').append(picker);
    let start = null;
    let bounds = null;
    const point = event => ({
        x: Math.max(bounds.left, Math.min(bounds.right, event.clientX)),
        y: Math.max(bounds.top, Math.min(bounds.bottom, event.clientY)),
    });
    const keydown = event => {
        event.preventDefault();
        event.stopImmediatePropagation();
        if (event.key === 'Escape') cancelSelection();
    };
    document.addEventListener('keydown', keydown, true);
    cancelSelection = () => {
        picker.remove();
        document.removeEventListener('keydown', keydown, true);
        window.removeEventListener('resize', cancelSelection);
        cancelSelection = () => {};
        client.focus({ preventScroll: true });
    };
    window.addEventListener('resize', cancelSelection);
    cancel.onclick = () => cancelSelection();
    picker.onpointerdown = event => {
        if (event.button !== 0 || hint.contains(event.target)) return;
        const canvas = el('screen').querySelector('canvas');
        if (!canvas) return;
        bounds = canvas.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        start = point(event);
        picker.setPointerCapture(event.pointerId);
        box.hidden = false;
        box.style.left = `${start.x}px`;
        box.style.top = `${start.y}px`;
        box.style.width = box.style.height = '0px';
        event.preventDefault();
    };
    picker.onpointermove = event => {
        if (!start) return;
        const end = point(event);
        box.style.left = `${Math.min(start.x, end.x)}px`;
        box.style.top = `${Math.min(start.y, end.y)}px`;
        box.style.width = `${Math.abs(end.x - start.x)}px`;
        box.style.height = `${Math.abs(end.y - start.y)}px`;
    };
    picker.onpointerup = event => {
        if (!start) return;
        const end = point(event);
        const layout = client.desktopLayout;
        const x = Math.round((Math.min(start.x, end.x) - bounds.left) / bounds.width * layout.width);
        const y = Math.round((Math.min(start.y, end.y) - bounds.top) / bounds.height * layout.height);
        const width = Math.min(layout.width - x, Math.round(Math.abs(end.x - start.x) / bounds.width * layout.width));
        const height = Math.min(layout.height - y, Math.round(Math.abs(end.y - start.y) / bounds.height * layout.height));
        start = null;
        picker.releasePointerCapture(event.pointerId);
        if (width < 8 || height < 8) { box.hidden = true; return; }
        customRegion = { x, y, width, height };
        if (!el('monitor').querySelector('option[value="custom"]')) {
            el('monitor').add(new Option('Selected area', 'custom'));
        }
        el('monitor').value = 'custom';
        client.displayRegion = customRegion;
        cancelSelection();
    };
    picker.onpointercancel = () => { start = null; box.hidden = true; };
};
el('toggle-controls').onclick = () => {
    cancelSelection();
    const hidden = !el('controls').hidden;
    el('controls').hidden = hidden;
    el('toggle-controls').textContent = hidden ? 'Show controls' : 'Hide controls';
    el('toggle-controls').setAttribute('aria-expanded', String(!hidden));
    if (hidden) rfb?.focus({ preventScroll: true });
};
const clearCredentials = () => { el('credentials').close(); el('fields').replaceChildren(); };
status('Connect to a VNC server through the current SSH session.');
el('form').onsubmit = event => {
    event.preventDefault();
    resetMonitors();
    clearCredentials();
    rfb?.disconnect();
    el('screen').replaceChildren();
    const url = new URL('./ws', location.href);
    url.protocol = 'ws:';
    url.search = new URLSearchParams({host: el('host').value, port: el('port').value});
    status('Connecting…');
    let client;
    try { client = new RFB(el('screen'), url.href); }
    catch { status('Cannot initialize VNC client'); return; }
    rfb = client;
    // Some servers omit cursor images or send a transparent cursor.
    client.showDotCursor = true;
    client.scaleViewport = el('scale').checked;
    client.viewOnly = el('readonly').checked;
    client.addEventListener('desktoplayout', () => {
        if (rfb === client) resetMonitors(true);
    });
    client.addEventListener('connect', () => {
        if (rfb === client) { status('Connected'); resetMonitors(true); }
    });
    client.addEventListener('disconnect', event => {
        if (rfb !== client) return;
        resetMonitors();
        clearCredentials();
        status(event.detail.clean ? 'Disconnected' : 'Connection failed or SSH disconnected. Check target, authentication and SSH forwarding.');
    });
    client.addEventListener('securityfailure', () => {
        if (rfb === client) status('VNC authentication failed');
    });
    client.addEventListener('credentialsrequired', event => {
        if (rfb !== client) return;
        clearCredentials();
        const fields = event.detail.types.map(type => {
            const label = document.createElement('label');
            label.textContent = type + ' ';
            const input = document.createElement('input');
            input.type = type === 'password' ? 'password' : 'text';
            input.autocomplete = 'off';
            label.append(input);
            el('fields').append(label);
            return [type, input];
        });
        el('login').onsubmit = event => {
            event.preventDefault();
            client.sendCredentials(Object.fromEntries(fields.map(([type, input]) => [type, input.value])));
            clearCredentials();
        };
        el('credentials').showModal();
        fields[0]?.[1].focus();
    });
    client.addEventListener('clipboard', event => {
        if (rfb === client) prompt('Remote clipboard (copy text):', event.detail.text);
    });
};
el('cancel').onclick = () => { clearCredentials(); rfb?.disconnect(); };
el('credentials').oncancel = () => { clearCredentials(); rfb?.disconnect(); };
el('disconnect').onclick = () => rfb?.disconnect();
el('scale').onchange = () => { cancelSelection(); if (rfb) rfb.scaleViewport = el('scale').checked; };
el('readonly').onchange = () => { if (rfb) rfb.viewOnly = el('readonly').checked; };
el('cad').onclick = () => rfb?.sendCtrlAltDel();
el('paste').onclick = () => {
    const text = prompt('Text to send to remote clipboard');
    if (text !== null) rfb?.clipboardPasteFrom(text);
};
</script>
</html>
